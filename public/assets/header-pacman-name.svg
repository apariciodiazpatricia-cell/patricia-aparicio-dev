<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="100%" height="210">
  <defs>
    <!-- Filtros Glow Neón Verde -->
    <filter id="neon-glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Filtro Glow Neón Amarillo -->
    <filter id="neon-glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="bg-header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0f140f" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>

    <linearGradient id="neon-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="50%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#00FFAA" />
    </linearGradient>
  </defs>

  <style>
    /* Ciclo total de animación: 8 segundos */
    @keyframes pacmanPass {
      0% { transform: translateX(40px); }
      82% { transform: translateX(850px); }
      100% { transform: translateX(850px); }
    }

    @keyframes chompTop {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-38deg); }
    }

    @keyframes chompBottom {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(38deg); }
    }

    /* Animaciones individuales para cada letra al ser comida */
    @keyframes eatL1 { 0%, 13% { opacity: 1; transform: scale(1); } 15%, 88% { opacity: 0; transform: scale(0.2); } 94%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes eatL2 { 0%, 18% { opacity: 1; transform: scale(1); } 20%, 88% { opacity: 0; transform: scale(0.2); } 94%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes eatL3 { 0%, 23% { opacity: 1; transform: scale(1); } 25%, 88% { opacity: 0; transform: scale(0.2); } 94%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes eatL4 { 0%, 28% { opacity: 1; transform: scale(1); } 30%, 88% { opacity: 0; transform: scale(0.2); } 94%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes eatL5 { 0%, 33% { opacity: 1; transform: scale(1); } 35%, 88% { opacity: 0; transform: scale(0.2); } 94%, 100% { opacity: 1; transform: scale(1); } }
    
    @keyframes eatL6 { 0%, 42% { opacity: 1; transform: scale(1); } 44%, 88% { opacity: 0; transform: scale(0.2); } 94%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes eatL7 { 0%, 47% { opacity: 1; transform: scale(1); } 49%, 88% { opacity: 0; transform: scale(0.2); } 94%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes eatL8 { 0%, 52% { opacity: 1; transform: scale(1); } 54%, 88% { opacity: 0; transform: scale(0.2); } 94%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes eatL9 { 0%, 57% { opacity: 1; transform: scale(1); } 59%, 88% { opacity: 0; transform: scale(0.2); } 94%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes eatL10 { 0%, 62% { opacity: 1; transform: scale(1); } 64%, 88% { opacity: 0; transform: scale(0.2); } 94%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes eatL11 { 0%, 67% { opacity: 1; transform: scale(1); } 69%, 88% { opacity: 0; transform: scale(0.2); } 94%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes eatL12 { 0%, 72% { opacity: 1; transform: scale(1); } 74%, 88% { opacity: 0; transform: scale(0.2); } 94%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes eatL13 { 0%, 77% { opacity: 1; transform: scale(1); } 79%, 88% { opacity: 0; transform: scale(0.2); } 94%, 100% { opacity: 1; transform: scale(1); } }

    @keyframes flickerHUD {
      0%, 100% { opacity: 1; }
      93% { opacity: 1; }
      94% { opacity: 0.5; }
      95% { opacity: 1; }
    }

    .pacman-eater {
      animation: pacmanPass 8s linear infinite;
    }

    .chomp-u {
      transform-origin: 22px 22px;
      animation: chompTop 0.2s ease-in-out infinite;
    }

    .chomp-d {
      transform-origin: 22px 22px;
      animation: chompBottom 0.2s ease-in-out infinite;
    }

    .neon-letter {
      font-family: 'Consolas', 'Courier New', monospace, sans-serif;
      font-weight: 900;
      font-size: 52px;
      fill: #00FF66;
      transform-origin: center;
    }

    .l1  { animation: eatL1 8s infinite; }
    .l2  { animation: eatL2 8s infinite; }
    .l3  { animation: eatL3 8s infinite; }
    .l4  { animation: eatL4 8s infinite; }
    .l5  { animation: eatL5 8s infinite; }
    .l6  { animation: eatL6 8s infinite; }
    .l7  { animation: eatL7 8s infinite; }
    .l8  { animation: eatL8 8s infinite; }
    .l9  { animation: eatL9 8s infinite; }
    .l10 { animation: eatL10 8s infinite; }
    .l11 { animation: eatL11 8s infinite; }
    .l12 { animation: eatL12 8s infinite; }
    .l13 { animation: eatL13 8s infinite; }

    .hud-title {
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: bold;
      animation: flickerHUD 4s infinite;
    }
  </style>

  <!-- Fondo Cyberpunk con Marco Neón -->
  <rect x="2" y="2" width="896" height="206" rx="16" fill="url(#bg-header-grad)" stroke="url(#neon-border)" stroke-width="2.5" />

  <!-- Líneas Tácticas -->
  <line x1="20" y1="36" x2="880" y2="36" stroke="#00FF66" stroke-width="1" opacity="0.3" stroke-dasharray="6 6" />
  <line x1="20" y1="172" x2="880" y2="172" stroke="#00FF66" stroke-width="1" opacity="0.3" stroke-dasharray="6 6" />

  <!-- Telemetría Superior -->
  <text x="30" y="25" fill="#00FF66" font-size="11" class="hud-title">SYSTEM_CORE: ACTIVE // MATRIX PROTOCOL // DEV_ID: PATRI_APARICIO</text>
  <text x="695" y="25" fill="#FFE600" font-size="11" class="hud-title">STATUS: READY_TO_WORK ⚡</text>

  <!-- Pista de Letras en Verde Neón "PATRI APARICIO" -->
  <g filter="url(#neon-glow-green)">
    <!-- PATRI -->
    <g transform="translate(90, 118)">
      <text x="0" y="0" class="neon-letter l1">P</text>
      <text x="44" y="0" class="neon-letter l2">A</text>
      <text x="88" y="0" class="neon-letter l3">T</text>
      <text x="130" y="0" class="neon-letter l4">R</text>
      <text x="172" y="0" class="neon-letter l5">I</text>
    </g>

    <!-- Espacio / Divisor Táctico -->
    <circle cx="320" cy="102" r="3.5" fill="#00FFAA" opacity="0.7" />

    <!-- APARICIO -->
    <g transform="translate(355, 118)">
      <text x="0" y="0" class="neon-letter l6">A</text>
      <text x="44" y="0" class="neon-letter l7">P</text>
      <text x="88" y="0" class="neon-letter l8">A</text>
      <text x="132" y="0" class="neon-letter l9">R</text>
      <text x="174" y="0" class="neon-letter l10">I</text>
      <text x="212" y="0" class="neon-letter l11">C</text>
      <text x="256" y="0" class="neon-letter l12">I</text>
      <text x="296" y="0" class="neon-letter l13">O</text>
    </g>
  </g>

  <!-- Pac-Man Dinámico Devorando las Letras de izquierda a derecha -->
  <g class="pacman-eater" transform="translate(0, 78)">
    <g filter="url(#neon-glow-yellow)">
      <!-- Mandíbula Superior -->
      <path d="M22,22 L44,22 A22,22 0 0,0 2,22 Z" fill="#FFE600" class="chomp-u" />
      <!-- Mandíbula Inferior -->
      <path d="M22,22 L2,22 A22,22 0 0,0 44,22 Z" fill="#FFE600" class="chomp-d" />
      <!-- Ojo -->
      <circle cx="24" cy="10" r="2.8" fill="#000000" />
    </g>
    <!-- Estela de Chispas Neón tras Pac-Man -->
    <circle cx="-6" cy="22" r="2.5" fill="#00FF66" opacity="0.75" />
    <circle cx="-16" cy="22" r="1.8" fill="#FFE600" opacity="0.5" />
  </g>

  <!-- Subtítulo Táctico Inferior -->
  <text x="450" y="193" text-anchor="middle" fill="#A0A0A0" font-size="12" class="hud-title">
    ⚡ &lt; FRONTEND DEVELOPER JUNIOR • REACT 19 • JAVASCRIPT ES6+ • SEVILLA &gt; ⚡
  </text>
</svg>
