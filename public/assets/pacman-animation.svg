<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160">
  <defs>
    <!-- Filtros Glow Neon -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="yellow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#111111" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="50%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#00FFAA" />
    </linearGradient>
  </defs>

  <style>
    @keyframes moveRunway {
      0% { transform: translateX(-350px); }
      100% { transform: translateX(950px); }
    }

    @keyframes chompTop {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-36deg); }
    }

    @keyframes chompBottom {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(36deg); }
    }

    @keyframes ghostBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    @keyframes scaredColor {
      0%, 70%, 100% { fill: #2855FF; }
      80%, 95% { fill: #FFFFFF; }
    }

    @keyframes eatGhost1 {
      0%, 20% { opacity: 1; transform: scale(1); }
      24%, 100% { opacity: 0; transform: scale(0); }
    }
    @keyframes score1 {
      0%, 20% { opacity: 0; transform: translateY(0px) scale(0.5); }
      25% { opacity: 1; transform: translateY(-12px) scale(1.1); }
      35%, 100% { opacity: 0; transform: translateY(-20px) scale(0.8); }
    }

    @keyframes eatGhost2 {
      0%, 45% { opacity: 1; transform: scale(1); }
      49%, 100% { opacity: 0; transform: scale(0); }
    }
    @keyframes score2 {
      0%, 45% { opacity: 0; transform: translateY(0px) scale(0.5); }
      50% { opacity: 1; transform: translateY(-12px) scale(1.1); }
      60%, 100% { opacity: 0; transform: translateY(-20px) scale(0.8); }
    }

    @keyframes eatGhost3 {
      0%, 70% { opacity: 1; transform: scale(1); }
      74%, 100% { opacity: 0; transform: scale(0); }
    }
    @keyframes score3 {
      0%, 70% { opacity: 0; transform: translateY(0px) scale(0.5); }
      75% { opacity: 1; transform: translateY(-12px) scale(1.1); }
      85%, 100% { opacity: 0; transform: translateY(-20px) scale(0.8); }
    }

    @keyframes pacmanAdvance {
      0% { transform: translateX(0px); }
      25% { transform: translateX(70px); }
      50% { transform: translateX(140px); }
      75% { transform: translateX(210px); }
      100% { transform: translateX(280px); }
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes neonFlicker {
      0%, 100% { opacity: 1; }
      93% { opacity: 1; }
      94% { opacity: 0.6; }
      95% { opacity: 1; }
    }

    .runway-group {
      animation: moveRunway 7.5s linear infinite;
    }

    .pacman-runner {
      animation: pacmanAdvance 7.5s ease-in-out infinite;
    }

    .chomp-upper {
      transform-origin: 22px 22px;
      animation: chompTop 0.22s ease-in-out infinite;
    }

    .chomp-lower {
      transform-origin: 22px 22px;
      animation: chompBottom 0.22s ease-in-out infinite;
    }

    .ghost-scared {
      animation: scaredColor 0.8s infinite, ghostBob 0.6s ease-in-out infinite;
    }

    .ghost-item-1 { animation: eatGhost1 7.5s infinite; }
    .score-item-1 { animation: score1 7.5s infinite; font-family: monospace; font-weight: bold; }

    .ghost-item-2 { animation: eatGhost2 7.5s infinite; }
    .score-item-2 { animation: score2 7.5s infinite; font-family: monospace; font-weight: bold; }

    .ghost-item-3 { animation: eatGhost3 7.5s infinite; }
    .score-item-3 { animation: score3 7.5s infinite; font-family: monospace; font-weight: bold; }

    .pulse-dot {
      animation: dotPulse 1.2s ease-in-out infinite;
      transform-origin: center;
    }

    .hud-text {
      font-family: 'Courier New', Courier, monospace, 'Segoe UI';
      font-weight: 800;
      letter-spacing: 2px;
      animation: neonFlicker 4s infinite;
    }
  </style>

  <!-- Marco Cyberpunk -->
  <rect x="2" y="2" width="896" height="156" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Líneas Tácticas HUD -->
  <line x1="20" y1="28" x2="880" y2="28" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="20" y1="132" x2="880" y2="132" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4" />

  <!-- HUD Telemetría Superior -->
  <text x="25" y="20" fill="#00FF66" font-size="10" class="hud-text">LEVEL: 2026 // POWER PELLET ACTIVE // EATING GHOSTS</text>
  <text x="680" y="20" fill="#FFE600" font-size="10" class="hud-text">PATRI_OS v2.5 // ONLINE</text>

  <!-- Pista de Puntos Energizers con Brillo Neón -->
  <g id="dots-track" fill="#FFE600" opacity="0.85">
    <circle cx="60" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.1s" />
    <circle cx="110" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.2s" />
    <circle cx="160" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.3s" />
    <circle cx="210" cy="80" r="6" fill="#00FF66" filter="url(#neon-glow)" class="pulse-dot" style="animation-delay: 0.4s" />
    <circle cx="260" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.5s" />
    <circle cx="310" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.6s" />
    <circle cx="360" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.7s" />
    <circle cx="410" cy="80" r="6" fill="#00FFAA" filter="url(#neon-glow)" class="pulse-dot" style="animation-delay: 0.8s" />
    <circle cx="460" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.9s" />
    <circle cx="510" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 1.0s" />
    <circle cx="560" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 1.1s" />
    <circle cx="610" cy="80" r="6" fill="#00FF66" filter="url(#neon-glow)" class="pulse-dot" style="animation-delay: 0.3s" />
    <circle cx="660" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.4s" />
    <circle cx="710" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.5s" />
    <circle cx="760" cy="80" r="6" fill="#FFE600" filter="url(#yellow-glow)" class="pulse-dot" style="animation-delay: 0.6s" />
    <circle cx="810" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.7s" />
    <circle cx="850" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.8s" />
  </g>

  <!-- Contenedor Dinámico: Pac-Man Persiguiendo y Devorando Fantasmas -->
  <g class="runway-group">

    <!-- 🟡 PAC-MAN ATACANTE (Persigue a los fantasmas desde atrás) -->
    <g class="pacman-runner" transform="translate(0, 58)" filter="url(#yellow-glow)">
      <!-- Mandíbula Superior -->
      <path d="M22,22 L44,22 A22,22 0 0,0 2,22 Z" fill="#FFE600" class="chomp-upper" />
      <!-- Mandíbula Inferior -->
      <path d="M22,22 L2,22 A22,22 0 0,0 44,22 Z" fill="#FFE600" class="chomp-lower" />
      <!-- Ojo Retro -->
      <circle cx="24" cy="10" r="2.5" fill="#000000" />
    </g>

    <!-- 👻 FANTASMITA 1 (Asustado / Comido a los 200 pts) -->
    <g transform="translate(90, 62)">
      <g class="ghost-item-1">
        <path d="M0 16 A 14 14 0 0 1 28 16 L 28 32 L 24 28 L 20 32 L 14 28 L 8 32 L 4 28 L 0 32 Z" class="ghost-scared" filter="url(#neon-glow)" />
        <!-- Ojos Asustados -->
        <circle cx="8" cy="14" r="3" fill="#FFE600" />
        <circle cx="20" cy="14" r="3" fill="#FFE600" />
        <path d="M6 24 Q10 21 14 24 Q18 21 22 24" stroke="#FFE600" stroke-width="2" fill="none" />
      </g>
      <!-- Puntuación Emergente +200 -->
      <text x="0" y="10" fill="#00FF66" font-size="12" class="score-item-1">+200</text>
    </g>

    <!-- 👻 FANTASMITA 2 (Asustado / Comido a los 400 pts) -->
    <g transform="translate(170, 62)">
      <g class="ghost-item-2">
        <path d="M0 16 A 14 14 0 0 1 28 16 L 28 32 L 24 28 L 20 32 L 14 28 L 8 32 L 4 28 L 0 32 Z" class="ghost-scared" style="animation-delay: 0.15s" filter="url(#neon-glow)" />
        <circle cx="8" cy="14" r="3" fill="#FFE600" />
        <circle cx="20" cy="14" r="3" fill="#FFE600" />
        <path d="M6 24 Q10 21 14 24 Q18 21 22 24" stroke="#FFE600" stroke-width="2" fill="none" />
      </g>
      <!-- Puntuación Emergente +400 -->
      <text x="0" y="10" fill="#00FFAA" font-size="12" class="score-item-2">+400</text>
    </g>

    <!-- 👻 FANTASMITA 3 (Asustado / Comido a los 800 pts) -->
    <g transform="translate(250, 62)">
      <g class="ghost-item-3">
        <path d="M0 16 A 14 14 0 0 1 28 16 L 28 32 L 24 28 L 20 32 L 14 28 L 8 32 L 4 28 L 0 32 Z" class="ghost-scared" style="animation-delay: 0.3s" filter="url(#neon-glow)" />
        <circle cx="8" cy="14" r="3" fill="#FFE600" />
        <circle cx="20" cy="14" r="3" fill="#FFE600" />
        <path d="M6 24 Q10 21 14 24 Q18 21 22 24" stroke="#FFE600" stroke-width="2" fill="none" />
      </g>
      <!-- Puntuación Emergente +800 -->
      <text x="0" y="10" fill="#FFE600" font-size="12" class="score-item-3">+800</text>
    </g>

    <!-- 🍒 Cereza Bonus al final del carril -->
    <g transform="translate(330, 68)">
      <circle cx="8" cy="14" r="6" fill="#FF0055" filter="url(#neon-glow)" />
      <circle cx="18" cy="16" r="6" fill="#FF0055" filter="url(#neon-glow)" />
      <path d="M8 10 Q14 2 18 4 Q16 10 16 12" stroke="#00FF66" stroke-width="2" fill="none" />
      <path d="M18 4 Q22 0 25 3" stroke="#00FFAA" stroke-width="1.8" fill="none" />
    </g>

  </g>

  <!-- HUD Telemetría Inferior -->
  <text x="25" y="148" fill="#A0A0A0" font-size="10" class="hud-text">
    &gt; MISSION: CONTRATAR A PATRI APARICIO // FRONTEND DEVELOPER // DISPONIBILIDAD INMEDIATA 🚀
  </text>

</svg>
