<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160">
  <defs>
    <!-- Filtros Glow Neon -->
    <filter id="glow-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#111111" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="50%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#00FFAA" />
    </linearGradient>
  </defs>

  <style>
    .score-txt {
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: 900;
      font-size: 15px;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .hud-txt {
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: bold;
    }
  </style>

  <!-- Marco Cyberpunk -->
  <rect x="2" y="2" width="896" height="156" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Líneas Tácticas HUD -->
  <line x1="20" y1="28" x2="880" y2="28" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="20" y1="132" x2="880" y2="132" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4" />

  <!-- HUD Telemetría Superior -->
  <text x="25" y="20" fill="#00FF66" font-size="10" class="hud-txt">LEVEL: 2026 // POWER PELLET ACTIVE // EATING GHOSTS</text>
  <text x="680" y="20" fill="#FFE600" font-size="10" class="hud-txt">PATRI_OS v2.5 // ONLINE</text>

  <!-- Pista de Puntos Energizers con Brillo Neón centrados exactamente en Y=80 -->
  <g fill="#FFE600" opacity="0.85">
    <circle cx="60" cy="80" r="3.5" />
    <circle cx="110" cy="80" r="3.5" />
    <circle cx="160" cy="80" r="3.5" />
    <circle cx="210" cy="80" r="6" fill="#00FF66" filter="url(#glow-neon)" />
    <circle cx="260" cy="80" r="3.5" />
    <circle cx="310" cy="80" r="3.5" />
    <circle cx="360" cy="80" r="3.5" />
    <circle cx="410" cy="80" r="6" fill="#00FFAA" filter="url(#glow-neon)" />
    <circle cx="460" cy="80" r="3.5" />
    <circle cx="510" cy="80" r="3.5" />
    <circle cx="560" cy="80" r="3.5" />
    <circle cx="610" cy="80" r="6" fill="#00FF66" filter="url(#glow-neon)" />
    <circle cx="660" cy="80" r="3.5" />
    <circle cx="710" cy="80" r="3.5" />
    <circle cx="760" cy="80" r="6" fill="#FFE600" filter="url(#glow-yellow)" />
    <circle cx="810" cy="80" r="3.5" />
    <circle cx="850" cy="80" r="3.5" />
  </g>

  <!-- Grupo Completo de Pac-Man y Fantasmas desplazándose de forma continua exactamente en Y=80 -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="-350,80; 950,80"
      keyTimes="0; 1"
      dur="7.5s"
      repeatCount="indefinite"
    />

    <!-- PAC-MAN (Persiguiendo desde atrás con avance progresivo hacia la derecha) -->
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; 70,0; 140,0; 210,0; 280,0"
        keyTimes="0; 0.25; 0.50; 0.75; 1"
        dur="7.5s"
        repeatCount="indefinite"
      />
      <!-- Cuerpo Pac-Man centrado en (0,0) -->
      <g filter="url(#glow-yellow)">
        <path d="M 0,0 L 22,0 A 22,22 0 0,0 -22,0 Z" fill="#FFE600">
          <animateTransform
            attributeName="transform"
            type="rotate"
            values="0 0 0; -35 0 0; 0 0 0"
            dur="0.2s"
            repeatCount="indefinite"
          />
        </path>
        <path d="M 0,0 L -22,0 A 22,22 0 0,0 22,0 Z" fill="#FFE600">
          <animateTransform
            attributeName="transform"
            type="rotate"
            values="0 0 0; 35 0 0; 0 0 0"
            dur="0.2s"
            repeatCount="indefinite"
          />
        </path>
        <circle cx="2" cy="-11" r="2.5" fill="#000000" />
      </g>
    </g>

    <!-- 👻 FANTASMITA 1 (Comido a los 200 pts) en x=90 -->
    <g transform="translate(90, 0)">
      <!-- Fantasma centrado en (0,0) -->
      <g filter="url(#glow-neon)">
        <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.20; 0.24; 1" dur="7.5s" repeatCount="indefinite" />
        <path d="M -14,-14 A 14 14 0 0 1 14,-14 L 14,14 L 10,10 L 6,14 L 0,10 L -6,14 L -10,10 L -14,14 Z" fill="#2855FF">
          <animate attributeName="fill" values="#2855FF; #2855FF; #FFFFFF; #2855FF" keyTimes="0; 0.6; 0.8; 1" dur="0.8s" repeatCount="indefinite" />
        </path>
        <circle cx="-5" cy="-5" r="3" fill="#FFE600" />
        <circle cx="5" cy="-5" r="3" fill="#FFE600" />
      </g>
      <!-- Puntuación Emergente +200 -->
      <text x="0" y="0" fill="#00FF66" class="score-txt" filter="url(#glow-neon)">
        +200
        <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.20; 0.25; 0.35; 0.40" dur="7.5s" repeatCount="indefinite" />
      </text>
    </g>

    <!-- 👻 FANTASMITA 2 (Comido a los 400 pts) en x=170 -->
    <g transform="translate(170, 0)">
      <g filter="url(#glow-neon)">
        <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.45; 0.49; 1" dur="7.5s" repeatCount="indefinite" />
        <path d="M -14,-14 A 14 14 0 0 1 14,-14 L 14,14 L 10,10 L 6,14 L 0,10 L -6,14 L -10,10 L -14,14 Z" fill="#2855FF">
          <animate attributeName="fill" values="#2855FF; #2855FF; #FFFFFF; #2855FF" keyTimes="0; 0.6; 0.8; 1" dur="0.8s" repeatCount="indefinite" />
        </path>
        <circle cx="-5" cy="-5" r="3" fill="#FFE600" />
        <circle cx="5" cy="-5" r="3" fill="#FFE600" />
      </g>
      <!-- Puntuación Emergente +400 -->
      <text x="0" y="0" fill="#00FFAA" class="score-txt" filter="url(#glow-neon)">
        +400
        <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.45; 0.50; 0.60; 0.65" dur="7.5s" repeatCount="indefinite" />
      </text>
    </g>

    <!-- 👻 FANTASMITA 3 (Comido a los 800 pts) en x=250 -->
    <g transform="translate(250, 0)">
      <g filter="url(#glow-neon)">
        <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.70; 0.74; 1" dur="7.5s" repeatCount="indefinite" />
        <path d="M -14,-14 A 14 14 0 0 1 14,-14 L 14,14 L 10,10 L 6,14 L 0,10 L -6,14 L -10,10 L -14,14 Z" fill="#2855FF">
          <animate attributeName="fill" values="#2855FF; #2855FF; #FFFFFF; #2855FF" keyTimes="0; 0.6; 0.8; 1" dur="0.8s" repeatCount="indefinite" />
        </path>
        <circle cx="-5" cy="-5" r="3" fill="#FFE600" />
        <circle cx="5" cy="-5" r="3" fill="#FFE600" />
      </g>
      <!-- Puntuación Emergente +800 -->
      <text x="0" y="0" fill="#FFE600" class="score-txt" filter="url(#glow-yellow)">
        +800
        <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.70; 0.75; 0.85; 0.90" dur="7.5s" repeatCount="indefinite" />
      </text>
    </g>

    <!-- 🍒 Cereza Bonus en x=330 -->
    <g transform="translate(330, 0)">
      <circle cx="-5" cy="4" r="6" fill="#FF0055" filter="url(#glow-neon)" />
      <circle cx="5" cy="6" r="6" fill="#FF0055" filter="url(#glow-neon)" />
      <path d="M -5,0 Q 0,-12 5,-10 Q 3,-3 3,0" stroke="#00FF66" stroke-width="2" fill="none" />
      <path d="M 5,-10 Q 9,-14 12,-11" stroke="#00FFAA" stroke-width="1.8" fill="none" />
    </g>

  </g>

  <!-- HUD Telemetría Inferior -->
  <text x="25" y="148" fill="#A0A0A0" font-size="10" class="hud-txt">
    &gt; MISSION: CONTRATAR A PATRI APARICIO // FRONTEND DEVELOPER // DISPONIBILIDAD INMEDIATA 🚀
  </text>

</svg>
