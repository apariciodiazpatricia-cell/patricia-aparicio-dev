<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160">
  <defs>
    <!-- Filtro Glow Neon Verde -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Filtro Glow Amarillo -->
    <filter id="yellow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#111111" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="50%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#00FFAA" />
    </linearGradient>
  </defs>

  <style>
    @keyframes moveRunway {
      0% { transform: translateX(-60px); }
      100% { transform: translateX(960px); }
    }

    @keyframes chompTop {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-32deg); }
    }

    @keyframes chompBottom {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(32deg); }
    }

    @keyframes ghostFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes neonFlicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.6; }
      94% { opacity: 1; }
      97% { opacity: 0.8; }
      98% { opacity: 1; }
    }

    .runway-wrapper {
      animation: moveRunway 7.5s linear infinite;
    }

    .chomp-upper {
      transform-origin: 22px 22px;
      animation: chompTop 0.28s ease-in-out infinite;
    }

    .chomp-lower {
      transform-origin: 22px 22px;
      animation: chompBottom 0.28s ease-in-out infinite;
    }

    .ghost-bob {
      animation: ghostFloat 0.7s ease-in-out infinite;
    }

    .pulse-dot {
      animation: dotPulse 1.2s ease-in-out infinite;
      transform-origin: center;
    }

    .hud-text {
      font-family: 'Courier New', Courier, monospace, 'Segoe UI';
      font-weight: 800;
      letter-spacing: 2px;
      animation: neonFlicker 4s infinite;
    }
  </style>

  <!-- Fondo Cyberpunk con Borde Neon -->
  <rect x="2" y="2" width="896" height="156" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Líneas de rejilla táctica -->
  <line x1="20" y1="28" x2="880" y2="28" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="20" y1="132" x2="880" y2="132" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4" />

  <!-- HUD Telemetría Superior -->
  <text x="25" y="20" fill="#00FF66" font-size="10" class="hud-text">LEVEL: 2026 // STAGE: FRONTEND JUNIOR // SCORE: 999990</text>
  <text x="680" y="20" fill="#FFE600" font-size="10" class="hud-text">PATRI_OS v2.5 // ONLINE</text>

  <!-- Pista de Puntos Estáticos / Energizers con Efecto Pulse -->
  <g id="dots-track" fill="#FFE600" opacity="0.85">
    <circle cx="60" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.1s" />
    <circle cx="100" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.2s" />
    <circle cx="140" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.3s" />
    <circle cx="180" cy="80" r="6" fill="#00FF66" filter="url(#neon-glow)" class="pulse-dot" style="animation-delay: 0.4s" />
    <circle cx="220" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.5s" />
    <circle cx="260" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.6s" />
    <circle cx="300" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.7s" />
    <circle cx="340" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.8s" />
    <circle cx="380" cy="80" r="6" fill="#00FFAA" filter="url(#neon-glow)" class="pulse-dot" style="animation-delay: 0.9s" />
    <circle cx="420" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 1.0s" />
    <circle cx="460" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 1.1s" />
    <circle cx="500" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 1.2s" />
    <circle cx="540" cy="80" r="6" fill="#00FF66" filter="url(#neon-glow)" class="pulse-dot" style="animation-delay: 0.3s" />
    <circle cx="580" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.4s" />
    <circle cx="620" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.5s" />
    <circle cx="660" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.6s" />
    <circle cx="700" cy="80" r="6" fill="#FFE600" filter="url(#yellow-glow)" class="pulse-dot" style="animation-delay: 0.7s" />
    <circle cx="740" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.8s" />
    <circle cx="780" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 0.9s" />
    <circle cx="820" cy="80" r="3.5" class="pulse-dot" style="animation-delay: 1.0s" />
  </g>

  <!-- Contenedor Animado de Pac-Man y Fantasmas -->
  <g class="runway-wrapper">
    
    <!-- 🍒 Cereza Bonus Cyber -->
    <g transform="translate(-180, 68)">
      <circle cx="8" cy="14" r="5.5" fill="#FF0055" filter="url(#neon-glow)" />
      <circle cx="16" cy="16" r="5.5" fill="#FF0055" filter="url(#neon-glow)" />
      <path d="M8 10 Q14 2 18 4 Q16 10 16 12" stroke="#00FF66" stroke-width="1.8" fill="none" />
      <path d="M18 4 Q22 0 25 3" stroke="#00FFAA" stroke-width="1.5" fill="none" />
    </g>

    <!-- 👻 Fantasma Rojo (Blinky) -->
    <g transform="translate(-130, 62)" class="ghost-bob">
      <path d="M0 16 A 14 14 0 0 1 28 16 L 28 32 L 24 28 L 20 32 L 14 28 L 8 32 L 4 28 L 0 32 Z" fill="#FF3366" filter="url(#neon-glow)" />
      <circle cx="9" cy="15" r="4" fill="#FFFFFF" />
      <circle cx="19" cy="15" r="4" fill="#FFFFFF" />
      <circle cx="11" cy="15" r="2" fill="#000066" />
      <circle cx="21" cy="15" r="2" fill="#000066" />
    </g>

    <!-- 👻 Fantasma Cyan (Inky) -->
    <g transform="translate(-85, 62)" class="ghost-bob" style="animation-delay: 0.2s">
      <path d="M0 16 A 14 14 0 0 1 28 16 L 28 32 L 24 28 L 20 32 L 14 28 L 8 32 L 4 28 L 0 32 Z" fill="#00FFAA" filter="url(#neon-glow)" />
      <circle cx="9" cy="15" r="4" fill="#FFFFFF" />
      <circle cx="19" cy="15" r="4" fill="#FFFFFF" />
      <circle cx="11" cy="15" r="2" fill="#000066" />
      <circle cx="21" cy="15" r="2" fill="#000066" />
    </g>

    <!-- 👻 Fantasma Naranja (Clyde) -->
    <g transform="translate(-40, 62)" class="ghost-bob" style="animation-delay: 0.4s">
      <path d="M0 16 A 14 14 0 0 1 28 16 L 28 32 L 24 28 L 20 32 L 14 28 L 8 32 L 4 28 L 0 32 Z" fill="#FF8800" filter="url(#neon-glow)" />
      <circle cx="9" cy="15" r="4" fill="#FFFFFF" />
      <circle cx="19" cy="15" r="4" fill="#FFFFFF" />
      <circle cx="11" cy="15" r="2" fill="#000066" />
      <circle cx="21" cy="15" r="2" fill="#000066" />
    </g>

    <!-- 🟡 Pac-Man Devorador (Boca Animada y Glow Amarillo) -->
    <g transform="translate(10, 58)" filter="url(#yellow-glow)">
      <!-- Mandíbula Superior -->
      <path d="M22,22 L44,22 A22,22 0 0,0 2,22 Z" fill="#FFE600" class="chomp-upper" />
      <!-- Mandíbula Inferior -->
      <path d="M22,22 L2,22 A22,22 0 0,0 44,22 Z" fill="#FFE600" class="chomp-lower" />
      <!-- Ojo Retro -->
      <circle cx="24" cy="10" r="2.5" fill="#000000" />
    </g>

  </g>

  <!-- HUD Telemetría Inferior -->
  <text x="25" y="148" fill="#A0A0A0" font-size="10" class="hud-text">
    &gt; MISSION: CONTRATAR A PATRI APARICIO // FRONTEND DEVELOPER // DISPONIBILIDAD INMEDIATA 🚀
  </text>

</svg>
